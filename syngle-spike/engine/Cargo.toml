# Spike A (#43): the native engine sidecar.
#
# A workspace member (added to the fork's root Cargo.toml `members`): it reuses the crates the
# desktop app already builds, so it costs one link step. Spike-only; drop the member line and this
# directory together.
[package]
name = "syngle-spike-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "syngle-spike-engine"
path = "src/main.rs"

[dependencies]
rustgis-engine = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
