[package]
name = "rustgis-map"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syngle Observatory L2: maps, layers, symbology, labeling, camera and basemaps"

[lints]
workspace = true

[features]
# Spike A (#43): raise the view-read windows from the shipped 100,000/250,000 (and 30,000/60,000
# remote) to 1,000,000, so the "pan with 1M points" target is measured with every feature drawn.
# Off by default; #77 revisits the shipped limits. Forwards to `rustgis-data`'s cap (500,000 in the
# browser), which would otherwise sample the view instead of holding it.
spike = ["rustgis-data/spike"]

[dependencies]
rustgis-geom = { workspace = true }
rustgis-data = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
web-time = { workspace = true }
proj4rs = { workspace = true }
roxmltree = { workspace = true }
serde_json = { workspace = true }

# Local views (`local:lon,lat`, map.viewMode "local") are azimuthal equidistant: proj4rs' `aeqd`, whose
# geodesic routines are C that needs libm (`remainder`, `remquo`), which wasm32-unknown-unknown lacks. So
# they are native-only; in the browser the projection is refused rather than drawn in Web Mercator.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proj4rs = { workspace = true, features = ["aeqd"] }
