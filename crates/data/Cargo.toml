[package]
name = "rustgis-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syngle Observatory L1: feature model, attribute values, vector I/O (GeoJSON, CSV, Shapefile, GeoPackage, GeoParquet, FlatGeobuf, KML/KMZ, GPX), data providers (GeoParquet, FlatGeobuf, GeoPackage) and rasters (GeoTIFF, ASCII grid)"

[lints]
workspace = true

[features]
# Spike A (#43): raise the browser read cap from the shipped 500,000 to 1,000,000, so the "pan with
# 1M points" target is measured with every feature really held by the browser view rather than
# sampled. Off by default; enabled through `rustgis-map`'s `spike` feature. #77 revisits it.
spike = []

[dependencies]
rustgis-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
csv = { workspace = true }
shapefile = { workspace = true }
# Zstandard, the usual compression of COGs, is C code that compiles to WebAssembly with clang
# (on the CI runners), so the browser decodes it too.
tiff = { workspace = true, features = ["zstd"] }
weezl.workspace = true
proj4rs = { workspace = true }
crs-definitions = { workspace = true }
miniz_oxide = { workspace = true }
roxmltree = { workspace = true }
# zstd, the usual compression of GeoParquet, compiles to WebAssembly like the GeoTIFF one above.
parquet = { workspace = true, features = ["zstd"] }
url = { workspace = true }
bytes = { workspace = true }
flatgeobuf = { workspace = true }
geozero = { workspace = true }
calamine = { workspace = true }
# LAZ (compressed LiDAR) point clouds.
laz = { workspace = true }
# KML ground overlays are PNG or JPEG pictures.
image = { workspace = true, features = ["jpeg"] }
# Geotagged photos keep a thumbnail as a data: address.
base64 = { workspace = true }
lz4_flex = { workspace = true }
ruzstd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true }
postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
mysql = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
# Writing sample GeoParquet files.
parquet = { workspace = true, features = ["arrow"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Writing Zstandard-compressed GeoTIFFs.
zstd = { workspace = true }
