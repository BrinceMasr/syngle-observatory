# The Australian government data lookup (`syngle-map gov ...`, Syngle-Ecosystem #628 to #630): the official extracts
# (ABN Bulk Extract, ASIC, G-NAF, ABS, ASGS) parsed as a stream into a versioned, read-by-position index. A library, so
# the sidecar's find-place can call the address index later without a second implementation. Native only: nothing
# below `apps/` depends on it, so the browser build never links it.
[package]
name = "observatory-gov"
description = "Syngle Observatory's Australian government data lookup: parsers, index, query and refresh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "observatory_gov"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
memchr = "2"
# The official downloads are ZIP files (the ABN extract, the ASIC datasets, G-NAF).
zip = { version = "2", default-features = false, features = ["deflate"] }
# ABS observations are SDMX-CSV (quoted cells), and the ASGS boundaries come as Shapefile or GeoPackage; the crates are the
# ones the data crate already reads those formats with. The ABS's .dbf files are CP1252, which needs the `yore` feature.
csv = { workspace = true }
shapefile = { workspace = true, features = ["yore"] }
rusqlite = { workspace = true }
# The network refresh and the live lookup: the same client, with the same TLS, as the other crates that fetch (ureq with
# rustls). `md-5` checks a download against the hash CKAN publishes, `fs4` reads the free space of the data disk.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
md-5 = "0.11"
fs4 = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
